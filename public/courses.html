<style>
  :root {
    --ink: #071727;
    --ink-2: #051729;
    --paper: #f8f5ef;
    --card: #fcfaf6;
    --line: rgba(7,23,39,0.14);
    --muted: #434e5b;
    --teal: #62b995;
    --teal-dark: #4fa67f;
    --surface-1: #f1eee7;
    --surface-2: #e8e4dc;
    --good: #2a9355;
    --bad: #c94545;
    --max: 1240px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin:0; padding:0; }
  body {
    font: 16px/1.6 'Public Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4 {
    font-family: 'Source Serif 4', Georgia, serif;
    letter-spacing: -0.01em;
  }
  .eyebrow, .chip, .meta, .pill, code, kbd, samp {
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  a { color: inherit; text-decoration: none; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(5, 23, 41, .95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(248, 245, 239, .12);
  }
  .header-inner {
    max-width: var(--max);
    margin: 0 auto;
    padding: 14px clamp(16px, 3vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--paper);
  }
  .brand img { width: 34px; height: 34px; }
  .brand span {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .header-actions { display: inline-flex; gap: 8px; }
  .hbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid transparent;
    font-weight: 600;
    font-size: 14px;
    line-height: 1;
    padding: 11px 14px;
    transition: .2s ease;
  }
  .hbtn.light { background: var(--paper); color: var(--ink); }
  .hbtn.dark { background: transparent; color: var(--paper); border-color: rgba(248,245,239,.3); }
  .hbtn.dark:hover { background: rgba(248,245,239,.08); }

  main {
    flex: 1;
    max-width: var(--max);
    margin: 0 auto;
    width: 100%;
    padding: 42px clamp(16px, 3vw, 32px) 58px;
  }
  .hero { margin-bottom: 24px; }
  .hero .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero h1 {
    font-size: clamp(32px, 4vw, 56px);
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .hero .sub {
    color: var(--muted);
    font-size: 15px;
  }

  .toolbar {
    margin-top: 18px;
    display: grid;
    gap: 12px;
  }
  .search-wrap input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--card);
    color: var(--ink);
    padding: 12px 14px;
    font: inherit;
  }
  .search-wrap input:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    padding: 8px 10px;
    cursor: pointer;
  }
  .chip.active {
    color: #0b5b45;
    border-color: var(--teal-dark);
    background: #e0f0e7;
  }

  .banner {
    padding: 13px 16px;
    border-radius: 10px;
    margin: 16px 0 10px;
    font-size: 14px;
    border: 1px solid var(--line);
    display: none;
  }
  .banner.ok { background: #d8f0e2; color: #1b6b3d; }
  .banner.err { background: #fbe0e0; color: #8a1a1a; }
  .banner.info { background: #e6efff; color: #0b457d; }

  .results { margin-top: 16px; color: var(--muted); font-size: 14px; }
  .catalog {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 0 rgba(7,23,39,.04), 0 8px 24px -12px rgba(7,23,39,.18);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .course-code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .new-tag {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #0b5b45;
    border: 1px solid #97d1b5;
    background: #e0f0e7;
    padding: 3px 7px;
    border-radius: 999px;
  }
  .card h3 { margin: 0; font-size: 24px; line-height: 1.1; }
  .card .desc { color: var(--muted); font-size: 14px; min-height: 64px; }
  .meta {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .05em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chips-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .level-pill {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-1);
    padding: 4px 8px;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .topic {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  .price-wrap { margin-top: 2px; }
  .card .price { font-size: 28px; font-weight: 700; color: var(--ink); margin: 0 0 4px; }
  .card .price .currency { font-size: 16px; color: var(--muted); margin-left: 4px; }
  .card .one-time { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  .actions {
    margin-top: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: .2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
  }
  .btn-open {
    background: var(--ink);
    color:#fff;
    border-color: var(--ink);
  }
  .btn-open:hover { background: var(--ink-2); }
  .btn-buy {
    background: #fff;
    color: var(--ink);
    border-color: var(--line);
  }
  .btn-buy:hover { border-color: var(--teal-dark); color: #0b5b45; }
  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .card .coupon-row {
    display: flex;
    gap: 6px;
    margin: 4px 0 8px;
    align-items: stretch;
  }
  .card .coupon-row input {
    flex: 1;
    min-width: 0;
    padding: 9px 11px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-1);
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .card .coupon-row input:focus {
    outline: 2px solid var(--teal); outline-offset: -1px;
  }
  .card .coupon-row button.apply {
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .card .coupon-row button.apply:hover { background: var(--surface-1); }
  .card .coupon-msg { font-size: 12.5px; margin: -6px 0 12px; min-height: 16px; }
  .card .coupon-msg.is-ok { color: var(--good); }
  .card .coupon-msg.is-err { color: var(--bad); }

  .card .price.has-discount {
    text-decoration: line-through; color: var(--muted); font-size: 18px; margin-bottom: 0;
  }
  .card .price.discounted { color: var(--good); margin-top: 2px; }

  .empty {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--muted);
    padding: 22px;
    text-align: center;
    margin-top: 14px;
  }

  footer.site {
    border-top: 1px solid var(--line);
    padding: 22px;
    color: var(--muted);
    font-size: 13px;
    text-align:center;
  }

  @media (max-width: 720px) {
    .header-inner { padding: 12px 16px; flex-wrap: wrap; }
    .brand span { font-size: 16px; }
    .hbtn { padding: 10px 12px; font-size: 13px; }
    .card h3 { font-size: 21px; }
  }
</style>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const banner = document.getElementById('banner');
function showBanner(text, kind) {
  banner.textContent = text;
  banner.className = 'banner ' + (kind || 'info');
  banner.style.display = text ? 'block' : 'none';
}

const params = new URLSearchParams(window.location.search);
if (params.get('status') === 'success') {
  showBanner('Payment received. Check your inbox for a sign-in link to start the course.', 'ok');
} else if (params.get('status') === 'cancelled') {
  showBanner('Checkout cancelled. No charge was made.', 'info');
} else if (params.get('free') === '1') {
  showBanner('Coupon applied. You are now enrolled at no cost. Visit your dashboard to start.', 'ok');
}

if (!window.supabaseClient && window.SUPABASE_URL && window.SUPABASE_PUBLISHABLE_KEY && window.supabase) {
  window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: 'implicit'
    }
  });
}

function formatPrice(cents, currency) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: (currency || 'usd').toUpperCase() })
    .format(cents / 100);
}

function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildChips() {
  const root = document.getElementById('chips');
  root.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (cat === _activeCategory ? ' active' : '');
    b.textContent = cat;
    b.addEventListener('click', () => {
      _activeCategory = cat;
      buildChips();
      renderFiltered();
    });
    root.appendChild(b);
  });
}

function getFiltered() {
  const q = _activeSearch.trim().toLowerCase();
  return _mergedCatalog.filter(c => {
    const catOk = _activeCategory === 'All' || c.category === _activeCategory;
    if (!catOk) return false;
    if (!q) return true;
    return [c.code, c.name, c.description, c.category, c.level].some(v => String(v || '').toLowerCase().includes(q));
  });
}

function renderFiltered() {
  const rows = getFiltered();
  document.getElementById('countLabel').textContent = rows.length + ' of ' + _mergedCatalog.length + ' courses';
  document.getElementById('resultMeta').textContent = rows.length === _mergedCatalog.length
    ? 'Browse the full program below. Sign in to start, track progress, and claim your certificate.'
    : 'Filtered results: ' + rows.length + ' course' + (rows.length === 1 ? '' : 's') + '.';
  renderCatalog(rows);
  document.getElementById('emptyState').hidden = rows.length !== 0;
}

function renderCatalog(catalog) {
  const root = document.getElementById('catalog');
  root.innerHTML = '';
  for (const c of catalog) {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-course', c.course_id);

    const canBuy = !_freeCoursesMode && c.cta === 'buy';
    const canOpen = c.cta === 'open' || !!c.open_url || _freeCoursesMode;
    const showCoupon = canBuy;

    card.innerHTML = `
      <div class="card-head">
        <div class="course-code">${escapeAttr(c.code || '')}</div>
        ${c.is_new ? '<span class="new-tag">New</span>' : ''}
      </div>
      <h3>${escapeAttr(c.name)}</h3>
      <p class="desc">${escapeAttr(c.description)}</p>
      <div class="meta"><span>${escapeAttr(c.duration || 'Self-paced')}</span><span>${escapeAttr(String(c.lessons || 0))} lessons</span></div>
      <div class="chips-row"><span class="topic">${escapeAttr(c.category || 'General')}</span><span class="level-pill">${escapeAttr(c.level || 'Foundations')}</span></div>
      <div class="price-wrap" ${canBuy ? '' : 'hidden'}>
        <div class="price" data-orig-price>${formatPrice(c.amount_cents || 0, c.currency || 'usd')}</div>
        <div class="price discounted" data-final-price hidden></div>
        <div class="one-time">One-time purchase &middot; lifetime access</div>
      </div>
      <div class="coupon-row" ${showCoupon ? '' : 'hidden'}>
        <input type="text" data-coupon-input placeholder="Coupon code (optional)" autocomplete="off" maxlength="64" />
        <button type="button" class="apply" data-coupon-apply>Apply</button>
      </div>
      <div class="coupon-msg" data-coupon-msg ${showCoupon ? '' : 'hidden'}></div>
      <div class="actions">
        ${canOpen ? `<a class="btn btn-open" data-open href="${escapeAttr(c.open_url || ('/courses/' + c.course_id))}">Open <span aria-hidden="true">→</span></a>` : ''}
        ${canBuy ? `<button class="btn btn-buy" data-buy="${escapeAttr(c.course_id)}">Buy now</button>` : ''}
      </div>
    `;
    root.appendChild(card);
  }
  root.querySelectorAll('button[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => startCheckout(btn.getAttribute('data-buy'), btn));
  });
  root.querySelectorAll('button[data-coupon-apply]').forEach(btn => {
    btn.addEventListener('click', () => applyCoupon(btn));
  });
  // Pressing Enter in the coupon field also applies it.
  root.querySelectorAll('input[data-coupon-input]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const card = inp.closest('.card');
        const btn = card && card.querySelector('button[data-coupon-apply]');
        if (btn) applyCoupon(btn);
      }
    });
    // Clearing the field resets state.
    inp.addEventListener('input', () => {
      const card = inp.closest('.card');
      const courseId = card.getAttribute('data-course');
      if (!inp.value.trim()) clearCouponDisplay(card, courseId);
    });
  });
}

function clearCouponDisplay(card, courseId) {
  delete _couponState[courseId];
  const orig = card.querySelector('[data-orig-price]');
  const fin  = card.querySelector('[data-final-price]');
  const msg  = card.querySelector('[data-coupon-msg]');
  const buy  = card.querySelector('button[data-buy]');
  if (orig) orig.classList.remove('has-discount');
  if (fin) { fin.hidden = true; fin.textContent = ''; }
  if (msg) { msg.className = 'coupon-msg'; msg.textContent = ''; }
  if (buy) buy.textContent = 'Buy now';
}

async function applyCoupon(applyBtn) {
  const card = applyBtn.closest('.card');
  if (!card) return;
  const courseId = card.getAttribute('data-course');
  const input = card.querySelector('input[data-coupon-input]');
  const msg   = card.querySelector('[data-coupon-msg]');
  const orig  = card.querySelector('[data-orig-price]');
  const fin   = card.querySelector('[data-final-price]');
  const buy   = card.querySelector('button[data-buy]');
  const code  = (input.value || '').trim().toUpperCase();
  input.value = code;
  if (!code) {
    clearCouponDisplay(card, courseId);
    return;
  }

  const sb = window.supabaseClient;
  if (!sb) {
    msg.className = 'coupon-msg is-err';
    msg.textContent = 'Coupon system unavailable. Please refresh and try again.';
    return;
  }
  // Coupons require authentication.
  let session = null;
  try {
    const { data } = await sb.auth.getSession();
    session = data && data.session;
  } catch (_e) { /* noop */ }
  if (!session || !session.user) {
    msg.className = 'coupon-msg is-err';
    msg.textContent = 'Please sign in to apply a coupon code (Dashboard → sign in with email).';
    return;
  }

  applyBtn.disabled = true;
  msg.className = 'coupon-msg';
  msg.textContent = 'Checking…';
  try {
    const { data, error } = await sb.rpc('preview_coupon', {
      p_code: code, p_course_slug: courseId
    });
    if (error) throw error;
    if (!data || data.valid !== true) {
      const reason = (data && data.reason) || 'invalid';
      msg.className = 'coupon-msg is-err';
      msg.textContent = COUPON_REASON_MSG[reason] || ('Coupon could not be applied (' + reason + ').');
      clearCouponDisplay(card, courseId);
      // Restore the entered code so the user can edit it.
      input.value = code;
      return;
    }
    _couponState[courseId] = {
      code,
      applied:        true,
      original_cents: data.original_cents,
      final_cents:    data.final_cents,
      discount_cents: data.discount_cents,
      is_free:        data.is_free === true,
      coupon_id:      data.coupon_id,
      percent_off:    data.percent_off
    };
    orig.classList.add('has-discount');
    fin.hidden = false;
    fin.textContent = data.is_free ? 'FREE' : formatPrice(data.final_cents, 'usd');
    msg.className = 'coupon-msg is-ok';
    msg.textContent = data.is_free
      ? `Coupon ${code} applied. 100% off (free).`
      : `Coupon ${code} applied. ${data.percent_off}% off.`;
    if (buy) buy.textContent = data.is_free ? 'Enroll for free' : 'Buy now';
  } catch (err) {
    msg.className = 'coupon-msg is-err';
    msg.textContent = 'Could not check coupon: ' + (err.message || err);
  } finally {
    applyBtn.disabled = false;
  }
}

async function startCheckout(courseId, btn) {
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Redirecting…';
  try {
    const headers = { 'Content-Type': 'application/json' };
    const sb = window.supabaseClient;
    let session = null;
    if (sb) {
      try {
        const { data } = await sb.auth.getSession();
        session = data && data.session;
      } catch (_e) { /* noop */ }
    }
    if (session && session.access_token) {
      headers['Authorization'] = 'Bearer ' + session.access_token;
    }
    const body = { course_id: courseId };
    const cs = _couponState[courseId];
    if (cs && cs.applied && cs.code) body.coupon_code = cs.code;

    const resp = await fetch('/api/checkout', {
      method: 'POST', headers, body: JSON.stringify(body)
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || 'checkout failed');
    if (data.free === true && data.redirect) {
      window.location.href = data.redirect;
      return;
    }
    if (!data.url) throw new Error('no checkout url returned');
    window.location.href = data.url;
  } catch (err) {
    showBanner('Could not start checkout: ' + err.message, 'err');
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function mergeDemoWithRuntime(cfg) {
  const runtime = {};
  (cfg.catalog || []).forEach(c => {
    runtime[c.course_id] = c;
  });

  return DEMO_COURSES.map(c => {
    const r = runtime[c.course_id] || null;
    const openUrl = '/courses/' + c.course_id;
    return {
      ...c,
      open_url: openUrl,
      amount_cents: r ? r.amount_cents : (c.course_id === 'crypto101' ? 29900 : 0),
      currency: r ? r.currency : 'usd'
    };
  });
}

function applyLaunchPolicy(catalog, cfg) {
  _freeCoursesMode = !!(cfg && cfg.launch && cfg.launch.free_courses_mode);
  if (!_freeCoursesMode) return catalog;
  return catalog.map(c => ({
    ...c,
    cta: 'open',
    amount_cents: 0
  }));
}

(function setupFilters() {
  const search = document.getElementById('searchInput');
  search.addEventListener('input', () => {
    _activeSearch = search.value || '';
    renderFiltered();
  });
})();

(async () => {
  buildChips();
  try {
    const resp = await fetch('/api/public-config');
    const cfg = await resp.json();
    _mergedCatalog = applyLaunchPolicy(mergeDemoWithRuntime(cfg), cfg);
    if (cfg.launch && cfg.launch.free_courses_mode) {
      showBanner('All courses are currently free during launch. Feel free to explore and open any course.', 'ok');
    }
    if (!cfg.stripe_publishable_key) {
      showBanner('Online checkout is temporarily unavailable. You can still browse and open courses.', 'err');
    }
  } catch (_err) {
    _mergedCatalog = DEMO_COURSES.map(c => ({
      ...c,
      open_url: '/courses/' + c.course_id,
      cta: 'open',
      amount_cents: c.course_id === 'crypto101' ? 29900 : 0,
      currency: 'usd'
    }));
    showBanner('Catalog loaded in demo mode due to config fetch error.', 'info');
  }
  renderFiltered();
})();
</script>

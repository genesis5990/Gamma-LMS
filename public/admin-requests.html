<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Access Requests — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/tenant.js"></script>
<script src="/request-access.js" defer></script>
<script src="/auth.js"></script>
<script src="/admin-nav.js" defer></script>
<script src="/admin-welcome.js" defer></script>
<link rel="stylesheet" href="/tenant-themes.css" />
<link rel="stylesheet" href="/brand-header.css" />
<style>
  :root {
    --ink: #0d1424; --ink-2: #1d2a47;
    --paper: #f7f8fc; --paper-2: #ffffff;
    --line: #d9dfee; --accent: #1f63d6; --accent-2: #0a3d91;
    --gold: #c8a64a; --muted: #5b6788; --good: #2a9355; --bad: #c94545;
    --brand-ink: var(--ink); --brand-bg: var(--gold);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--paper);
    min-height: 100vh;
  }
  .app-header .actions { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .app-header .btn-ghost {
    background: transparent; color:#fff; border:1px solid rgba(255,255,255,.2);
    padding: 7px 12px; border-radius:6px; font-size:13px; cursor:pointer; text-decoration:none;
  }
  .app-header .btn-ghost:hover { background: rgba(255,255,255,.08); }
  .app-header .admin-nav { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .app-header .admin-nav .btn-ghost.is-current,
  .app-header .admin-nav .btn-ghost[aria-current="page"] {
    background: rgba(200,166,74,.18);
    border-color: var(--gold);
    color: #f5e7bf;
    font-weight: 600;
  }
  @media (max-width: 760px) {
    .app-header .actions { width: 100%; flex-wrap: wrap; }
  }

  main { max-width: 1100px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px); }
  .h { display:flex; align-items:baseline; gap:14px; margin-bottom: 18px; }
  .h h2 { margin:0; font-size: 22px; }
  .h .muted { color: var(--muted); font-size: 14px; }
  .tabs { display:flex; gap:8px; margin: 14px 0 18px; flex-wrap: wrap; }
  .tab {
    padding: 7px 14px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line); cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--ink);
  }
  .tab.active { background: var(--ink); color:#fff; border-color: var(--ink); }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: #fff; border:1px solid var(--line); border-radius: 10px; }

  .req {
    background:#fff; border:1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 14px;
    display:grid; gap: 12px;
    grid-template-columns: 1fr auto;
  }
  .req .body h3 { margin: 0 0 4px; font-size: 16px; }
  .req .body .meta { color: var(--muted); font-size: 13px; margin: 2px 0; }
  .req .body .note { margin-top: 8px; padding: 10px 12px; background: var(--paper); border-radius: 6px; font-size: 14px; }
  .req .body .stat { font-size: 12px; padding: 2px 8px; border-radius: 999px; display:inline-block; margin-left: 6px; vertical-align:middle; }
  .stat.pending  { background: #fff3d4; color: #8a6314; }
  .stat.approved { background: #d8f0e2; color: #1b6b3d; }
  .stat.denied   { background: #fbe0e0; color: #8a1a1a; }

  .req .actions { display:flex; flex-direction:column; gap:8px; min-width: 170px; }
  .req .actions button {
    padding: 9px 12px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; border: 0;
  }
  .req .actions .ok { background: var(--good); color: #fff; }
  .req .actions .ok:hover:not(:disabled) { background: #237a47; }
  .req .actions .ng { background: #fff; color: var(--bad); border: 1px solid var(--bad); }
  .req .actions .ng:hover { background: #fbe0e0; }
  .req .actions button:disabled { opacity: .5; cursor: not-allowed; }
  .req .actions select.tenant-picker {
    padding: 7px 8px; font-size: 13px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .req .actions .hint { font-size: 11px; color: var(--muted); margin: -2px 0 -2px; line-height: 1.25; }

  .banner { padding: 12px 16px; border-radius: 8px; margin: 0 0 14px; font-size: 14px; }
  .banner.ok { background: #d8f0e2; color: #1b6b3d; }
  .banner.err { background: #fbe0e0; color: #8a1a1a; }
  .banner.info { background: #e6efff; color: var(--accent-2); }

  .gate {
    background:#fff; border:1px solid var(--line); border-radius: 12px; padding: 32px; max-width: 480px; margin: 60px auto;
    text-align: center;
  }
  .gate h2 { margin: 0 0 12px; font-size: 18px; }
  .gate input { padding: 10px 12px; width: 100%; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; margin: 8px 0; }
  .gate button { padding: 10px 18px; font-size: 14px; background: var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
  .gate .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/brand/icon-dark.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#060A16" />
</head>
<body>

<header class="app-header">
  <a class="brand" href="/" aria-label="Deconflict home">
    <img class="brand-mark" src="/brand/logo-mark.svg" alt="Deconflict" width="36" height="36" />
    <span class="brand-name">DECONFLICT</span>
    <span class="page-title">Access Requests</span>
  </a>
  <div class="actions">
    <nav class="admin-nav" aria-label="Admin sections">
      <a class="btn-ghost" href="/admin">Dashboard</a>
      <a class="btn-ghost is-current" href="/admin/requests" aria-current="page">Access requests</a>
      <a class="btn-ghost" href="/admin/coupons">Coupons</a>
      <a class="btn-ghost" href="/studio">Course Studio</a>
      <a class="btn-ghost" href="/courses">Catalog</a>
      <a class="btn-ghost" href="/">Live site</a>
    </nav>
    <button class="btn-ghost" id="signOutBtn" type="button">Sign out</button>
  </div>
</header>

<main id="root">
  <div id="banner" class="banner" style="display:none;"></div>
  <div id="content">
    <div class="empty">No requests to approve.</div>
  </div>
</main>

<script>
// Single shared Supabase client created by auth.js (loaded earlier on this page).
const sb = window.supabaseClient;
if (!sb) {
  console.error('[admin-requests] window.supabaseClient is missing — auth.js must load before this script');
  throw new Error('supabaseClient unavailable');
}

const banner = document.getElementById('banner');
function showBanner(text, kind) {
  banner.textContent = text;
  banner.className = 'banner ' + (kind || 'info');
  banner.style.display = 'block';
}

document.getElementById('signOutBtn').addEventListener('click', () => window.signOut());

// Tenant slug from URL (matches tenant.js logic)
function tenantSlug() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  if (parts[0] && /^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$/.test(parts[0])) return parts[0];
  return null;
}

let _profile = null;
let _activeTab = 'pending';
let _tenants = []; // [{id, name}], loaded once for super_admins to populate intake-row pickers

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderGate(message) {
  const root = document.getElementById('content');
  root.innerHTML = `
    <div class="gate">
      <h2>${escapeHtml(message || 'Sign in required')}</h2>
      <p class="note">This page is only available to program administrators.</p>
      <input id="gateEmail" type="email" placeholder="admin@example.com" />
      <button id="gateBtn" type="button">Email me a sign-in link</button>
      <div id="gateMsg" class="note" style="margin-top:12px;"></div>
    </div>
  `;
  document.getElementById('gateBtn').addEventListener('click', async () => {
    const email = document.getElementById('gateEmail').value.trim();
    if (!email) return;
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });
    document.getElementById('gateMsg').textContent =
      error ? 'Could not send link: ' + error.message : 'Check your inbox for a sign-in link.';
  });
}

function isAuthorized(profile) {
  if (!profile) return false;
  if (profile.role === 'super_admin') return true;
  if (profile.role === 'tenant_admin') return true;
  return false;
}

async function loadTenants() {
  if (_profile?.role !== 'super_admin') { _tenants = []; return; }
  const { data, error } = await sb
    .from('tenants')
    .select('id,name')
    .order('name', { ascending: true });
  if (error) {
    console.warn('[admin-requests] tenants load failed', error);
    _tenants = [];
    return;
  }
  _tenants = data || [];
}

async function loadRequests() {
  const wantStatus = _activeTab;
  const { data, error } = await sb
    .from('access_requests')
    .select('id,email,full_name,agency,badge_number,rank,supervisor_name,supervisor_email,note,status,deny_reason,created_at,reviewed_at,tenant_id,tenants:tenant_id(name,slug)')
    .eq('status', wantStatus)
    .order('created_at', { ascending: false });
  if (error) {
    showBanner('Failed to load requests: ' + error.message, 'err');
    return [];
  }
  return data || [];
}

function renderRequests(rows) {
  const content = document.getElementById('content');
  let html = '';
  html += `<div class="h"><h2>Access requests</h2><span class="muted">${rows.length} ${_activeTab}</span></div>`;
  html += `<div class="tabs">
    ${['pending','approved','denied'].map(t =>
      `<button class="tab ${t === _activeTab ? 'active' : ''}" data-tab="${t}">${t.charAt(0).toUpperCase() + t.slice(1)}</button>`
    ).join('')}
  </div>`;

  if (!rows.length) {
    html += `<div class="empty">No ${_activeTab} requests.</div>`;
  } else {
    for (const r of rows) {
      const tname = r.tenants?.name || (r.tenant_id ? '' : 'Intake (unassigned)');
      const supLine = r.supervisor_name || r.supervisor_email
        ? `Supervisor: ${escapeHtml(r.supervisor_name || '')}${r.supervisor_email ? ' &middot; ' + escapeHtml(r.supervisor_email) : ''}`
        : '';
      const noteBlock = r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : '';
      const denyReasonBlock = r.status === 'denied' && r.deny_reason
        ? `<div class="note"><strong>Deny reason:</strong> ${escapeHtml(r.deny_reason)}</div>` : '';
      const isIntake = r.status === 'pending' && !r.tenant_id;
      const canAssign = isIntake && _profile?.role === 'super_admin' && _tenants.length > 0;
      const tenantPicker = canAssign
        ? `<select class="tenant-picker" data-id="${r.id}">
             <option value="">— Assign tenant —</option>
             ${_tenants.map(t => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)}</option>`).join('')}
           </select>
           <div class="hint">Assign tenant before approving</div>`
        : '';
      const approveDisabled = isIntake ? 'disabled' : '';
      const actionBtns = r.status === 'pending'
        ? `${tenantPicker}
           <button class="ok" data-act="approve" data-id="${r.id}" ${approveDisabled}>Approve</button>
           <button class="ng" data-act="deny" data-id="${r.id}">Deny…</button>`
        : '';
      html += `
        <div class="req" data-row-id="${r.id}">
          <div class="body">
            <h3>${escapeHtml(r.full_name)}<span class="stat ${r.status}">${escapeHtml(r.status)}</span></h3>
            <div class="meta">${escapeHtml(r.email)} &middot; ${escapeHtml(r.agency)} &middot; Badge ${escapeHtml(r.badge_number)}${r.rank ? ' &middot; ' + escapeHtml(r.rank) : ''}</div>
            <div class="meta">${tname ? 'Tenant: ' + escapeHtml(tname) + ' &middot; ' : ''}Submitted ${new Date(r.created_at).toLocaleString()}</div>
            ${supLine ? `<div class="meta">${supLine}</div>` : ''}
            ${noteBlock}
            ${denyReasonBlock}
          </div>
          <div class="actions">${actionBtns}</div>
        </div>`;
    }
  }
  content.innerHTML = html;

  content.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    _activeTab = b.getAttribute('data-tab');
    refresh();
  }));
  // Enable/disable Approve based on tenant picker selection (intake rows only)
  content.querySelectorAll('select.tenant-picker').forEach(sel => {
    sel.addEventListener('change', () => {
      const id = sel.getAttribute('data-id');
      const approveBtn = content.querySelector(`button[data-act="approve"][data-id="${id}"]`);
      if (approveBtn) approveBtn.disabled = !sel.value;
    });
  });

  content.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const id  = b.getAttribute('data-id');
    const act = b.getAttribute('data-act');
    if (act === 'approve') {
      const picker = content.querySelector(`select.tenant-picker[data-id="${id}"]`);
      const tenantId = picker ? (picker.value || null) : null;
      if (picker && !tenantId) {
        showBanner('Please assign a tenant before approving this intake request.', 'err');
        return;
      }
      return doAction(id, 'approve', null, b, tenantId);
    }
    const reason = window.prompt('Reason for denial (optional, will be sent to applicant):', '');
    if (reason === null) return;
    doAction(id, 'deny', reason || null, b, null);
  }));
}

async function doAction(requestId, action, reason, btn, tenantId) {
  if (btn) btn.disabled = true;
  const body = { request_id: requestId, action, reason };
  if (tenantId) body.tenant_id = tenantId;
  const { data, error } = await sb.functions.invoke('approve-request', { body });
  if (error || (data && data.error)) {
    showBanner((error?.message) || (data?.error) || `${action} failed`, 'err');
    if (btn) btn.disabled = false;
    return;
  }
  showBanner(`Request ${action === 'approve' ? 'approved' : 'denied'} — email sent.`, 'ok');
  refresh();
}

async function refresh() {
  const rows = await loadRequests();
  renderRequests(rows);
}

(async () => {
  await window.authReady;
  const slug = tenantSlug();
  const adminLink = document.getElementById('adminLink');
  if (adminLink) adminLink.setAttribute('href', slug ? `/${slug}/admin` : '/admin');

  const user = window.currentUser?.();
  if (!user) return renderGate('Sign in to review access requests');

  const { data: prof } = await sb.from('profiles').select('id,email,role,tenant_id').eq('id', user.id).single();
  _profile = prof;
  if (!isAuthorized(prof)) {
    return renderGate('Your account is not authorized to view this page');
  }

  await loadTenants();
  refresh();
})();
</script>

</body>
</html>

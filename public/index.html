<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deconflict Academy</title>
  <meta name="description" content="Deconflict Academy. Cryptocurrency investigation training for law enforcement. Launching soon." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/brand/site.webmanifest" />
  <meta name="theme-color" content="#071727" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bone: #F8F5EF;
      --ink: #071727;
      --surface: #051729;
      --card: #FCFAF6;
      --hairline: rgba(7, 23, 39, 0.14);
      --muted: #434E5B;
      --teal: #62B995;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: var(--bone);
      color: var(--ink);
      font-family: 'Public Sans', system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top nav */
    .nav {
      background: var(--surface);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--bone);
      text-decoration: none;
    }

    .nav-emblem {
      height: 36px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    .nav-wordmark {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.04em;
      color: var(--bone);
    }

    /* Main hero */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
    }

    .hero {
      max-width: 720px;
      text-align: center;
    }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .hero-headline {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(48px, 8vw, 88px);
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 32px;
    }

    .hero-body {
      font-size: 18px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .hero-divider {
      width: 64px;
      height: 1px;
      background: var(--hairline);
      margin: 0 auto 40px;
    }

    .hero-meta {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-meta-divider {
      display: inline-block;
      margin: 0 12px;
      color: var(--hairline);
    }

    /* Footer */
    footer {
      padding: 24px 32px;
      border-top: 1px solid var(--hairline);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .nav { padding: 16px 20px; }
      main { padding: 48px 20px; }
      .hero-body { font-size: 16px; }
      .hero-meta-divider { display: block; margin: 6px 0; }
      .nav-emblem { height: 30px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="/">
      <img class="nav-emblem" src="/brand/logo-mark.svg" alt="Deconflict" />
      <span class="nav-wordmark">DECONFLICT</span>
    </a>
  </nav>

  <main>
    <div class="hero">
      <div class="hero-eyebrow">Deconflict Academy</div>
      <h1 class="hero-headline">Launching soon.</h1>
      <p class="hero-body">Cryptocurrency investigation training for sworn law enforcement.</p>
      <div class="hero-divider"></div>
      <div class="hero-meta">
        For program inquiries
        <span class="hero-meta-divider">·</span>
        contact@deconflict.com
      </div>
    </div>
  </main>

  <footer>
    Deconflict Academy &nbsp;·&nbsp; Cryptocurrency investigation training
  </footer>

</body>
</html>
